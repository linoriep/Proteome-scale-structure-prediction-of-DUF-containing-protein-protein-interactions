[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duf-string-af3"
version = "0.1.0"
description = "Reproducible analysis of STRING-selected DUF-containing AlphaFold 3 complexes"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
